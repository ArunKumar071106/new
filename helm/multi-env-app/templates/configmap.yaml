apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-env-app.fullname" . }}-config
  labels:
    {{- include "multi-env-app.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  APP_ENV: {{ .Values.environment | quote }}
  APP_VERSION: {{ include "multi-env-app.appVersion" . | quote }}
  REPLICA_COUNT: {{ .Values.replicaCount | quote }}
  HELM_RELEASE: {{ .Release.Name | quote }}
  HELM_CHART_VERSION: {{ .Chart.Version | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
