# ---------------------------------------------------------------------------
# Default (base) values for the multi-env-app chart.
# Environment files (values-dev.yaml, values-test.yaml, values-staging.yaml,
# values-prod.yaml) override only what differs from these defaults:
#
#   helm install myapp-dev ./helm/multi-env-app -f ./helm/multi-env-app/values-dev.yaml
#
# Do NOT put passwords, tokens or keys here. Sensitive values belong in a
# Kubernetes Secret that is referenced through `existingSecret`.
# ---------------------------------------------------------------------------

# One of: development, testing, staging, production
environment: development

replicaCount: 1

image:
  repository: multi-env-app
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

app:
  name: "Multi-Env Config Dashboard"
  # Version shown on the dashboard. Defaults to the image tag, then appVersion.
  version: ""

# Non-sensitive settings. Every key becomes an environment variable via the
# ConfigMap (templates/configmap.yaml). Values are always rendered as strings.
config:
  LOG_LEVEL: "INFO"
  DEBUG_MODE: "false"
  FEATURE_BETA_BANNER: "false"
  MAX_CONNECTIONS: "10"
  CACHE_TTL_SECONDS: "60"
  DATABASE_HOST: "localhost"
  API_BASE_URL: "http://localhost:5000/api"

# Name of a pre-existing Secret whose keys are exposed as env vars
# (for example SECRET_KEY). Leave empty to let the app generate a random key.
#   kubectl create secret generic myapp-secrets -n prod --from-literal=SECRET_KEY=$(openssl rand -hex 32)
existingSecret: ""

containerPort: 5000

service:
  type: NodePort
  port: 80
  # Fixed NodePort (30000-32767) so each environment has a predictable URL.
  # Leave empty to let Kubernetes choose one.
  nodePort: ""

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Image used by `helm test` (templates/tests/test-connection.yaml).
tests:
  image: busybox:1.36
